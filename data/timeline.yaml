- year: "入行"
  title: "后端工程师"
  detail: "从写接口、修 bug 开始，把新手该踩的坑基本踩全了：单点故障、缓存雪崩、慢 SQL、凌晨三点陪上线。现在回头看，那几年攒下的不是技术本身，而是「一个系统会怎么坏」的直觉。"

- year: "扛系统"
  title: "架构师"
  detail: "开始负责大流量系统的架构与稳定性：做容量评估、做故障预案、做复盘改进。这阶段最大的转变是想明白一件事——架构是取舍的艺术，不是最优解的艺术；没有完美的方案，只有当下约束下最合适的那个。"

- year: "折腾"
  title: "创业者 / 独立开发者"
  detail: "技术合伙人和独立开发都做过：从 0 到 1 搭过团队，也把项目做到过不得不关停。失败教会我的比成功多得多，所以创业复盘里我写失败写得最细——那不是自嘲，是这些经历最值钱。"

- year: "现在"
  title: "写代码、写文章、帮人做选择"
  detail: "主业仍然是做技术，业余维护这个博客，偶尔帮技术人做职业咨询和架构评审。想做的事一直很朴素：把我踩过的坑，整理成别人能绕开的地图。"
