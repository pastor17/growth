# =============================================================
# 工具与工作流 —— 工具总览数据
# 只收录「亲身实战过」的工具；每条都要讲清：用途 / 适用 / 不适用 / 坑点 / 备选
# 字段：name 名称 / purpose 用途 / scenario 适用场景 / notFor 不适用场景
#       pitfall 踩坑提醒 / alternative 备选方案
# =============================================================

- id: "architecture-ops"
  name: "架构 & 运维工具"
  emoji: "🛠️"
  description: "面向后端、架构师、运维，全部来自生产环境实战，而非网上搜集。"
  tools:
    - name: "Prometheus + Grafana"
      purpose: "指标监控与可视化告警，压测/容量观察的基础底座。"
      scenario: "服务数量多、需要多维聚合与告警规则的规模化后端。"
      notFor: "单机小项目、只有一两个服务且无人值守的场景，属于过度建设。"
      pitfall: "长期不清理指标会吃满磁盘；高基数标签（如把 userId 当标签）会把 TSDB 拖垮。"
      alternative: "小规模可用 Node Exporter + Netdata，或云厂商托管监控。"

    - name: "Loki + Promtail"
      purpose: "日志聚合与检索，按 label 过滤、快速定位。"
      scenario: "多实例服务需要统一查日志、和指标/追踪对齐时间线时。"
      notFor: "对日志做复杂全文统计分析的场景（它不是搜索引擎）。"
      pitfall: "label 设计错了，查询成本会爆炸；别把日志正文内容当 label。"
      alternative: "体量小时直接 tail/grep + systemd journal，或云日志服务。"

    - name: "OpenTelemetry"
      purpose: "统一的链路追踪与可观测性数据标准。"
      scenario: "微服务/多语言栈需要端到端 trace 时。"
      notFor: "还没搞清楚要解决什么观测问题的早期项目，先别上。"
      pitfall: "采样率没配好，追踪数据量能把后端压垮；埋点成本常被低估。"
      alternative: "Jaeger/Zipkin 起步更轻，或云厂商 APM。"

    - name: "Nginx / OpenResty"
      purpose: "反向代理、限流、缓存、灰度路由、WAF 前置。"
      scenario: "统一入口、需要按需扩缩与细粒度流量控制。"
      notFor: "纯内部 RPC 场景没必要硬套一层网关。"
      pitfall: "配置漂移难治理；限流规则写错会把正常用户误伤。"
      alternative: "Envoy / APISIX（需要更动态的网关能力时）。"

    - name: "Redis"
      purpose: "缓存、分布式锁、计数、消息队列等通用内存组件。"
      scenario: "热点读放大、需要跨实例共享状态时。"
      notFor: "把 Redis 当持久化数据库用、存不可丢失数据。"
      pitfall: "大 key、热 key、缓存雪崩/穿透/击穿三件套，线上事故高发。"
      alternative: "数据量小且单机够用时，进程内缓存即可。"

    - name: "k6 / wrk"
      purpose: "压测与性能基线，验证容量与稳定性。"
      scenario: "上线前容量评估、大促/改版前回归。"
      notFor: "对生产环境直接打高压而不做隔离与观测（会打出事故）。"
      pitfall: "压测结果要看 P95/P99 与毛刺，只看均值会误判。"
      alternative: "JMeter（偏业务脚本）、Locust（Python 友好）。"

    - name: "ClickHouse"
      purpose: "海量数据实时分析型数据库。"
      scenario: "日志分析、用户行为漏斗、时序聚合等大宽表场景。"
      notFor: "频繁单行更新/删除的 OLTP 场景，选型错误代价很大。"
      pitfall: "分布键与分区设计不当，查询会退化成全表扫描。"
      alternative: "数据量小用 PostgreSQL + 物化视图即可。"

- id: "startup-indie"
  name: "创业 & 独立开发工具"
  emoji: "💼"
  description: "面向创业者、独立开发者、小团队，讲早期创业真实工作流。"
  tools:
    - name: "Notion / 飞书文档"
      purpose: "需求库、产品文档、会议纪要、团队知识库。"
      scenario: "早期团队需要一处沉淀想法与决策记录。"
      notFor: "复杂项目管理（甘特、依赖、迭代）不适合硬塞。"
      pitfall: "文档不维护会变成信息坟场；权限与结构要先定好。"
      alternative: "Linear / 飞书 + 多维表格组合。"

    - name: "Linear"
      purpose: "轻量敏捷项目管理，迭代与 issue 跟踪。"
      scenario: "研发小团队希望流程轻、上手快的看板。"
      notFor: "非研发团队或需要强流程管控的大组织。"
      pitfall: "工具再顺也替代不了「谁对结果负责」的共识。"
      alternative: "Jira（重流程）、Trello（更轻）。"

    - name: "Figma"
      purpose: "产品原型与界面设计协作。"
      scenario: "MVP 阶段快速出稿、与开发对齐交互。"
      notFor: "不做设计投入的纯后台项目，可先用线框图工具。"
      pitfall: "设计稿与真实实现长期脱节，要有开发评审环节。"
      alternative: "Excalidraw / Whimsical（低保真）。"

    - name: "Stripe / 微信支付 / 支付宝"
      purpose: "收款、订阅、发票与对账。"
      scenario: "独立产品需要变现、订阅续费时。"
      notFor: "还没验证付费意愿就提前接支付（过度工程）。"
      pitfall: "退款、争议、税务合规容易被忽略，早期就要想清楚。"
      alternative: "Lemon Squeezy / Paddle（托管式，省合规成本）。"

    - name: "GA / Plausible / Matomo"
      purpose: "访问分析、转化漏斗。"
      scenario: "上线后要判断渠道与留存时。"
      notFor: "还在做 idea 验证、没有流量的阶段。"
      pitfall: "隐私合规（GDPR）与数据口径要在一开始定好。"
      alternative: "Plausible（轻量隐私友好）。"

    - name: "飞书 / Slack"
      purpose: "团队沟通与协作。"
      scenario: "跨职能小团队的日常同步。"
      notFor: "把聊天当项目唯一事实来源（信息会散落）。"
      pitfall: "通知过载会摧毁专注；关键结论要回写到文档。"
      alternative: "Discord（社区/用户群场景）。"

- id: "career-productivity"
  name: "职业成长 & 个人效率工具"
  emoji: "🧑‍🎓"
  description: "面向程序员与技术管理者，讲职业发展与自我管理，重点是「人的约束」。"
  tools:
    - name: "Obsidian"
      purpose: "本地优先的 Markdown 知识库与卡片笔记。"
      scenario: "长期沉淀技术笔记、建立自己的知识树。"
      notFor: "多人实时协作编辑（它不擅长）。"
      pitfall: "插件装太多、结构过度设计，会变成「记笔记的笔记」。"
      alternative: "Logseq / 飞书文档（协作场景）。"

    - name: "Anki"
      purpose: "间隔重复记忆，攻克需要背的内容。"
      scenario: "面试八股、体系化知识点的长期记忆。"
      notFor: "理解类、需要动手实践的内容（光背没用）。"
      pitfall: "卡做太多、不做取舍，会变成负担。"
      alternative: "自制错题本 / 定期回顾清单。"

    - name: "Raycast / Alfred"
      purpose: "启动器与脚本化工作流，减少重复操作。"
      scenario: "高频切换工具、执行自建小脚本。"
      notFor: "Windows 用户需另找对应方案（PowerToys）。"
      pitfall: "配置复杂度上去了，边际收益反而下降。"
      alternative: "macOS Spotlight + 简单 shell 脚本。"

    - name: "Typora / Markdown"
      purpose: "技术文档、方案、复盘的可移植写作格式。"
      scenario: "写方案、复盘、教程，追求版本可控与迁移。"
      notFor: "重度排版、需要复杂表格布局的场合。"
      pitfall: "团队协作需统一模板与目录规范，否则各自为政。"
      alternative: "VS Code + Markdown 插件。"

- id: "ai-engineering"
  name: "AI 工程工具"
  emoji: "🤖"
  description: "把大模型当后端组件时真实在用的工程工具：编排、推理、检索、可观测（2026 热点方向，均经真实部署验证）。"
  tools:
    - name: "LangGraph / OpenAI Agents SDK"
      purpose: "Agent 编排：有状态流程可控（LangGraph），或轻量接入模型生态（OpenAI Agents SDK）。"
      scenario: "生产 Agent 需要状态管理、多步工具调用与失败回退时。"
      notFor: "纯知识问答、单轮简单调用（直接调 API 即可）。"
      pitfall: "编排复杂度被低估；长任务上下文与 token 成本线性上涨，先做上下文治理。"
      alternative: "Dify（低代码平台层，业务同学可搭）。"

    - name: "vLLM"
      purpose: "高性能开源 LLM 推理服务（PagedAttention，兼容 OpenAI API），私有化部署主流选择。"
      scenario: "数据不能出域、需要自托管推理且吞吐要求高时。"
      notFor: "小体量 / 无合规要求时（调托管 API 更划算，别自建）。"
      pitfall: "显存与并发参数、KV Cache 配置影响吞吐明显；版本迭代快，升级前看 changelog。"
      alternative: "SGLang / TensorRT-LLM，或直接托管 API。"

    - name: "Qdrant / pgvector"
      purpose: "RAG 的向量存储：pgvector 随 PostgreSQL 起步最省，Qdrant 适合独立高并发向量服务。"
      scenario: "小团队先 pgvector 验证检索质量，量级上来再迁专用向量库。"
      notFor: "还没做对「切分与召回」就上分布式向量集群（工具救不了设计问题）。"
      pitfall: "Embedding 维度与索引参数（HNSW 的 M/ef）影响召回与内存，需压测调参。"
      alternative: "Milvus（大规模集群）、云托管向量库。"

    - name: "Langfuse"
      purpose: "LLM 可观测性：trace 每次调用的 prompt / 输出 / token 成本，支持评测与回放。"
      scenario: "生产 LLM 应用上线必备：定位幻觉、追成本、复盘失败案例。"
      notFor: "demo 阶段（先跑通再说）；埋点不全等于白做。"
      pitfall: "prompt 可能含敏感数据，记录前要脱敏；自托管注意存储与备份。"
      alternative: "LangSmith（商业）、自建日志表。"

- id: "office-ai"
  name: "AI 效率办公工具"
  emoji: "💡"
  description: "表格、PPT、写作、翻译与本地模型——办公室里真实在用的 AI 提效方式，含开源替代路线。"
  tools:
    - name: "WPS AI / Microsoft Copilot"
      purpose: "文档与表格的 AI 助手：写公式、总结、改写、生成 PPT 骨架。"
      scenario: "高频 Office 文档处理、不想改变现有文件习惯时。"
      notFor: "复杂多表关联分析与关键业务判断（生成结论必须人工核对）。"
      pitfall: "生成公式与格式在不同版本间不兼容；数字与结论要先验证再用。"
      alternative: "LibreOffice + Ollama 的开源路线。"

    - name: "Ollama / LM Studio"
      purpose: "本地跑开源模型：改写、摘要、分类、翻译，数据不出设备。"
      scenario: "隐私敏感文档、离线处理、零成本调试提示词。"
      notFor: "需要强推理与创作的场景（能力边界见端侧小模型篇）。"
      pitfall: "量化模型效果与宣传有差距，先拿自己任务集实测。"
      alternative: "云端大模型（能力优先时）。"

    - name: "n8n"
      purpose: "开源工作流自动化：把 AI 接口、表格、邮件、通知串成流程。"
      scenario: "取数→处理→通知这类重复流程；个人或小团队的自动化。"
      notFor: "复杂业务编排（它扛不住）；没人维护的流程别写太多。"
      pitfall: "自托管要养（升级/备份）；流程超过十条会变成新的维护负担。"
      alternative: "Zapier / Make（托管省心）。"

    - name: "沉浸式翻译 / Marp"
      purpose: "外文双语对照阅读（沉浸式翻译）；Markdown 写幻灯片（Marp）。"
      scenario: "读外文文档论文、技术分享的 PPT 制作。"
      notFor: "正式出版级翻译（机器味重）；复杂动效的演示文稿。"
      pitfall: "翻译额度/Key 要自备；Marp 排版不如商业套件。"
      alternative: "DeepL 网页版；reveal.js（要动效时）。"

- id: "personal-workflow"
  name: "我的个人工作流"
  emoji: "📝"
  description: "串联整套流程的方法论，看到的不只是工具，更是思考与做事方式。"
  tools:
    - name: "架构方案工作流"
      purpose: "调研 → 选型 → POC → 落地复盘 的固定节奏。"
      scenario: "每个重大技术决策都按这套流程走，可复现、可复盘。"
      notFor: "小改动、临时脚本不需要走完整流程。"
      pitfall: "POC 不设「验证什么才算通过」，等于白做。"
      alternative: "轻量场景用 ADR（架构决策记录）留痕即可。"

    - name: "线上排障工作流"
      purpose: "发现 → 止血 → 定位 → 复盘 的标准化动作。"
      scenario: "线上故障统一按此链路执行，减少慌乱与误操作。"
      notFor: "无监控、无日志的小项目，先补可观测性。"
      pitfall: "先止血再定位，别在故障中反复「看一眼」浪费黄金时间。"
      alternative: "结合 tools 栏目的《线上排障工具链》。"

    - name: "写作输出工作流"
      purpose: "选题 → 大纲 → 初稿 → 复盘 的内容生产闭环。"
      scenario: "博客、分享、个人品牌的持续输出。"
      notFor: "追求一次性完美的完美主义拖延。"
      pitfall: "写作卡在「怕写不好」，先完成再完美。"
      alternative: "卡片盒笔记法（见 Obsidian）。"
