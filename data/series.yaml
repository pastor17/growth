# =============================================================
# 成长体系 —— 系列与章节目录
# group：所属大类（决定成长体系总目录页的分组）
# chapters：章节清单，status 取值：
#   done    已发布（slug 对应 content/growth/<slug>.md）
#   draft   撰写中（暂不展示正文，仅作占位）
#   planned 规划中（只展示标题，作为路线图）
# =============================================================

- id: "engineering-backend"
  group: "工程技术教程"
  name: "后端架构落地教程"
  emoji: "📘"
  color: "#1f6f8b"
  audience: "3–8 年后端工程师"
  prerequisite: "具备业务开发经验，能独立负责模块"
  description: "不做入门语法，聚焦工程落地与决策取舍：从需求到架构方案、选型、缓存、分布式、稳定性、评审。"
  chapters:
    - slug: "tech-selection-methodology"
      title: "技术选型完整方法论：如何做 POC、如何评估取舍"
      status: "done"
      summary: "选型不是列优缺点打分，而是把业务约束翻译成可验证的假设。"
    - slug: "business-architecture-breakdown"
      title: "如何做业务架构拆解：从需求输出架构方案"
      status: "done"
      summary: "从业务目标倒推边界、模块与数据流，先画清楚再写代码。"
    - slug: "cache-system-design"
      title: "缓存体系设计实战：多级缓存、失效策略与缓存坑"
      status: "done"
      summary: "雪崩、穿透、击穿、热 key 的完整应对，与「什么时候不该用缓存」。"
    - slug: "distributed-system-design"
      title: "分布式系统设计：不要过度设计"
      status: "done"
      summary: "什么规模才值得上分布式，一致性、可用性的现实取舍。"
    - slug: "online-stability"
      title: "线上稳定性建设：告警、故障演练、复盘完整流程"
      status: "planned"
      summary: "从可观测性到故障演练与复盘，把稳定性做成工程能力。"
    - slug: "architecture-review"
      title: "架构评审怎么做：评审清单与常见反模式"
      status: "planned"
      summary: "评审不是走过场，附可复用的评审清单。"
  order: 1

- id: "engineering-ai"
  group: "工程技术教程"
  name: "AI 工程落地教程"
  emoji: "🤖"
  color: "#5b5bd6"
  audience: "后端工程师、想落地 AI 应用的技术负责人"
  prerequisite: "熟悉后端开发，对 LLM 有基本了解"
  description: "把大模型当作一种新的后端组件，用工程视角落地 RAG / Agent / 可观测 / 推理部署 / 成本控制。"
  chapters:
    - slug: "rag-production"
      title: "RAG 系统从 POC 到生产：完整落地要点"
      status: "done"
      summary: "检索链路、召回缺陷、幻觉来源、降级与成本，以及为什么 80% 的知识库不可用。"
    - slug: "agent-development"
      title: "Agent 应用开发：编排、提示工程、边界与降级"
      status: "planned"
      summary: "Agent 不是越智能越好，边界约束与失败降级才是生产关键。"
    - slug: "llm-observability"
      title: "大模型应用可观测性：监控幻觉、token 成本与调用失败"
      status: "planned"
      summary: "把 LLM 纳入统一观测体系，而不是黑盒调用。"
    - slug: "llm-private-deploy"
      title: "私有化推理部署：vLLM 选型、算力评估与扩缩容"
      status: "done"
      summary: "什么时候必须私有化、什么时候调 API 更划算，成本账怎么算。"
    - slug: "ai-cost-control"
      title: "AI 项目成本控制：缓存、限流、降级策略"
      status: "done"
      summary: "token 账单不可控的根源，与工程侧的成本治理。"
  order: 2

- id: "softskills"
  group: "技术人软技能"
  name: "技术人软技能系列"
  emoji: "💬"
  color: "#0e7c66"
  audience: "开发、技术负责人"
  prerequisite: "有一定工程经验，希望补齐技术与协作之间的短板"
  description: "很多人技术很强，但不会写方案、不会沟通、不会对齐，做不了架构师。这个系列补上工程软能力。"
  chapters:
    - slug: "tech-design-writing"
      title: "如何写技术方案：架构方案、调研报告模板"
      status: "done"
      summary: "把想法讲清楚、讲给对的人听，附可直接套用的方案模板。"
    - slug: "tech-reporting"
      title: "技术人如何做技术汇报：评审、向上汇报、对外分享"
      status: "planned"
      summary: "同一件事，对内讲风险、向上讲价值、对外讲方法。"
    - slug: "cross-team-collaboration"
      title: "跨团队协作：如何推动业务与产品落地技术改造"
      status: "planned"
      summary: "技术改造最大的阻力往往不是技术，而是人。"
    - slug: "tech-communication"
      title: "如何做技术沟通：争论、需求博弈、拒绝不合理需求"
      status: "planned"
      summary: "不带情绪地表达立场，把争论变成决策。"
    - slug: "code-review"
      title: "代码评审怎么做：高质量 CR，不带情绪提意见"
      status: "planned"
      summary: "CR 是团队协作的镜子，不是挑刺。"
    - slug: "incident-communication"
      title: "故障沟通：事故如何对内对外同步、复盘不甩锅"
      status: "planned"
      summary: "事故处理的一半功夫在沟通与信任。"
    - slug: "scheduling"
      title: "时间与排期管理：评估工作量，规避排期陷阱"
      status: "planned"
      summary: "不靠谱的排期比延期更伤团队。"
  order: 3

