# =============================================================
# 站群 / 互链网络
# 用途：
#   1) 页脚友链（含 description 时以 title 提示）
#   2) /hubs/ 站群导航页 —— 给主域名一个可被抓取的中枢页，
#      把 6 个子域串成一张主题图谱，而不是页脚里几个裸链接
# 说明：6 个站点同属一个主体、主题互补但互不重复，
#      交叉内链能让搜索引擎更快发现新站、也强化主域的主题权威。
# =============================================================

